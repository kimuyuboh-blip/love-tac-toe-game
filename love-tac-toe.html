<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Game For You </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-1:#ffe9f0;
    --pink-2:#ffd3e2;
    --pink-3:#ffb6c9;
    --cream:#fff8f2;
    --rose-gold:#e8b4a0;
    --rose-gold-dark:#c98a72;
    --text-dark:#6b4452;
    --white:#ffffff;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Quicksand', sans-serif;
    background: radial-gradient(circle at 20% 20%, var(--pink-1), var(--cream) 60%),
                linear-gradient(135deg, var(--pink-1), var(--pink-2));
    color:var(--text-dark);
    overflow-x:hidden;
    padding:24px;
  }

  .app{
    position:relative;
    width:100%;
    max-width:460px;
  }

  /* ---------- Card shell ---------- */
  .card{
    background:var(--white);
    border-radius:28px;
    padding:36px 28px 32px;
    box-shadow:0 20px 45px rgba(201,138,114,0.22), 0 4px 12px rgba(201,138,114,0.12);
    text-align:center;
    animation: fadeInUp 0.9s ease both;
  }

  @keyframes fadeInUp{
    from{ opacity:0; transform:translateY(24px) scale(0.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  h1.title{
    font-family:'Dancing Script', cursive;
    font-size:2.4rem;
    margin:0 0 4px;
    color:var(--rose-gold-dark);
  }

  p.subtitle{
    margin:0 0 22px;
    font-size:0.95rem;
    color:#a9808c;
    letter-spacing:0.3px;
  }

  /* ---------- Status ---------- */
  #status{
    min-height:28px;
    font-weight:600;
    font-size:1.05rem;
    margin-bottom:18px;
    color:var(--rose-gold-dark);
    transition:opacity 0.3s ease;
  }

  /* ---------- Board ---------- */
  #board{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:12px;
    margin:0 auto 22px;
    max-width:320px;
  }

  .cell{
    aspect-ratio:1/1;
    background:linear-gradient(145deg, var(--pink-1), var(--white));
    border:2px solid var(--pink-2);
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2.2rem;
    cursor:pointer;
    user-select:none;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
  }

  .cell:hover:not(.filled){
    transform:translateY(-3px);
    box-shadow:0 8px 16px rgba(201,138,114,0.2);
    background:linear-gradient(145deg, var(--pink-2), var(--white));
  }

  .cell.filled{ cursor:default; }

  .cell .piece{
    display:inline-block;
    animation: popIn 0.35s cubic-bezier(.26,1.6,.5,1) both;
  }

  @keyframes popIn{
    from{ transform:scale(0) rotate(-15deg); opacity:0; }
    to{ transform:scale(1) rotate(0); opacity:1; }
  }

  .cell.win-cell{
    background:linear-gradient(145deg, #ffd9e6, #fff0f5);
    border-color:var(--rose-gold);
    animation: glowPulse 1s ease-in-out infinite;
  }

  @keyframes glowPulse{
    0%,100%{ box-shadow:0 0 0 rgba(232,180,160,0); }
    50%{ box-shadow:0 0 18px rgba(232,180,160,0.7); }
  }

  /* ---------- Reset button ---------- */
  .btn{
    border:none;
    border-radius:999px;
    padding:13px 28px;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:1rem;
    color:var(--white);
    background:linear-gradient(135deg, var(--rose-gold), var(--pink-3));
    cursor:pointer;
    box-shadow:0 10px 20px rgba(201,138,114,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .btn:hover{
    transform:translateY(-2px) scale(1.03);
    box-shadow:0 14px 26px rgba(201,138,114,0.45);
  }

  .btn:active{ transform:translateY(0) scale(0.98); }

  .hidden{ display:none !important; }

  /* ---------- Fade transition between screens ---------- */
  .fade-out{
    animation: fadeOutDown 0.6s ease both;
  }
  @keyframes fadeOutDown{
    from{ opacity:1; transform:translateY(0) scale(1); }
    to{ opacity:0; transform:translateY(18px) scale(0.96); }
  }

  .fade-in{
    animation: fadeInUp 0.9s ease both;
  }

  /* ---------- Reveal card ---------- */
  #reveal-screen{
    text-align:center;
  }

  #reveal-screen h2{
    font-family:'Dancing Script', cursive;
    font-size:2rem;
    color:var(--rose-gold-dark);
    margin:0 0 18px;
  }

  #reveal-screen .message{
    font-size:1.08rem;
    line-height:1.75;
    color:var(--text-dark);
    margin:0 0 28px;
  }

  #reveal-screen .message b{
    color:var(--rose-gold-dark);
  }

  .yes-btn{
    font-size:1.15rem;
    padding:16px 40px;
  }

  .thanks-msg{
    margin-top:18px;
    font-family:'Dancing Script', cursive;
    font-size:1.6rem;
    color:var(--rose-gold-dark);
    opacity:0;
    animation: fadeInUp 0.8s ease forwards;
    animation-delay:0.1s;
  }

  /* ---------- Confetti & hearts ---------- */
  #fx-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:9999;
  }

  .confetti-piece{
    position:absolute;
    top:-20px;
    border-radius:2px;
    animation-name: confettiFall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }

  @keyframes confettiFall{
    0%{ transform: translateY(0) rotate(0deg); opacity:1; }
    100%{ transform: translateY(110vh) rotate(720deg); opacity:0.9; }
  }

  .floating-heart{
    position:absolute;
    bottom:-40px;
    font-size:1.6rem;
    animation-name: heartFloat;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
  }

  @keyframes heartFloat{
    0%{ transform: translateY(0) translateX(0) scale(0.7); opacity:0; }
    10%{ opacity:1; }
    100%{ transform: translateY(-110vh) translateX(var(--drift, 0px)) scale(1.1); opacity:0; }
  }
</style>
</head>
<body>

<div class="app">

  <div id="game-screen" class="card">
    <h1 class="title">You &amp; Me, Tic-Tac-Toe</h1>
    <p class="subtitle">You're 💖 &nbsp;·&nbsp; I'm ✨ &nbsp;·&nbsp; you go first</p>

    <div id="status">Your turn, beautiful 💖</div>

    <div id="board"></div>

    <button id="reset-btn" class="btn hidden">Try again, beautiful! 💕</button>
  </div>

  <div id="reveal-screen" class="card hidden">
    <h2>You got three in a row… ✨💖✨</h2>
    <p class="message">
      You won the game, but I won the lottery when I met you.
      It was love at first sight. 💖<br><br>
      <b>Excited to spend time with you on the 5th, it's our 2nd date.</b>
    </p>
    <button id="yes-btn" class="btn yes-btn">Can't wait! 🥰</button>
    <div id="thanks-msg" class="thanks-msg hidden"></div>
  </div>

</div>

<div id="fx-layer"></div>

<script>
(function(){
  const HUMAN = 'human';
  const AI = 'ai';
  const HUMAN_PIECE = '💖';
  const AI_PIECE = '✨';

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('reset-btn');
  const gameScreen = document.getElementById('game-screen');
  const revealScreen = document.getElementById('reveal-screen');
  const yesBtn = document.getElementById('yes-btn');
  const thanksMsg = document.getElementById('thanks-msg');
  const fxLayer = document.getElementById('fx-layer');

  const WIN_PATTERNS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let board = Array(9).fill(null);
  let gameActive = true;
  let currentTurn = HUMAN;

  function renderBoard(){
    boardEl.innerHTML = '';
    board.forEach((val, idx) => {
      const cell = document.createElement('div');
      cell.className = 'cell' + (val ? ' filled' : '');
      cell.dataset.index = idx;
      if (val){
        const piece = document.createElement('span');
        piece.className = 'piece';
        piece.textContent = val === HUMAN ? HUMAN_PIECE : AI_PIECE;
        cell.appendChild(piece);
      }
      cell.addEventListener('click', onCellClick);
      boardEl.appendChild(cell);
    });
  }

  function onCellClick(e){
    const idx = Number(e.currentTarget.dataset.index);
    if (!gameActive || board[idx] !== null || currentTurn !== HUMAN) return;
    makeMove(idx, HUMAN);
  }

  function makeMove(idx, player){
    board[idx] = player;
    renderBoard();

    const winPattern = getWinningPattern(player);
    if (winPattern){
      gameActive = false;
      highlightWin(winPattern);
      if (player === HUMAN){
        statusEl.textContent = 'You won! 💖✨';
        setTimeout(() => triggerWinSequence(), 550);
      } else {
        statusEl.textContent = 'Oh no, I got lucky this time! ✨';
        showResetButton();
      }
      return;
    }

    if (board.every(c => c !== null)){
      gameActive = false;
      statusEl.textContent = "It's a sweet little draw!";
      showResetButton();
      return;
    }

    currentTurn = player === HUMAN ? AI : HUMAN;

    if (currentTurn === AI){
      statusEl.textContent = '✨ is thinking...';
      setTimeout(aiMove, 550);
    } else {
      statusEl.textContent = 'Your turn, beautiful 💖';
    }
  }

  function aiMove(){
    if (!gameActive) return;
    const emptyCells = board
      .map((v, i) => v === null ? i : null)
      .filter(v => v !== null);
    if (emptyCells.length === 0) return;
    const randomIdx = emptyCells[Math.floor(Math.random() * emptyCells.length)];
    makeMove(randomIdx, AI);
  }

  function getWinningPattern(player){
    return WIN_PATTERNS.find(pattern =>
      pattern.every(idx => board[idx] === player)
    ) || null;
  }

  function highlightWin(pattern){
    pattern.forEach(idx => {
      const cell = boardEl.querySelector(`.cell[data-index="${idx}"]`);
      if (cell) cell.classList.add('win-cell');
    });
  }

  function showResetButton(){
    resetBtn.classList.remove('hidden');
  }

  resetBtn.addEventListener('click', () => {
    board = Array(9).fill(null);
    gameActive = true;
    currentTurn = HUMAN;
    resetBtn.classList.add('hidden');
    statusEl.textContent = 'Your turn, beautiful 💖';
    renderBoard();
  });

  function triggerWinSequence(){
    launchConfetti();
    gameScreen.classList.add('fade-out');
    setTimeout(() => {
      gameScreen.classList.add('hidden');
      revealScreen.classList.remove('hidden');
      revealScreen.classList.add('fade-in');
    }, 550);
  }

  /* ---------- Confetti ---------- */
  const CONFETTI_COLORS = ['#ffb6c9','#ffd3e2','#e8b4a0','#c98a72','#fff0f5','#ffe9f0','#f7c6d9'];

  function launchConfetti(){
    const count = 140;
    for (let i = 0; i < count; i++){
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      const size = 6 + Math.random() * 8;
      piece.style.width = size + 'px';
      piece.style.height = (size * (0.4 + Math.random()*0.6)) + 'px';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      const duration = 2.2 + Math.random() * 1.8;
      const delay = Math.random() * 0.4;
      piece.style.animationDuration = duration + 's';
      piece.style.animationDelay = delay + 's';
      fxLayer.appendChild(piece);
      setTimeout(() => piece.remove(), (duration + delay) * 1000 + 200);
    }
  }

  /* ---------- Floating hearts ---------- */
  const HEART_EMOJIS = ['💖','💕','💗','💓','💞','❤️'];

  function launchHearts(){
    const count = 40;
    for (let i = 0; i < count; i++){
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.textContent = HEART_EMOJIS[Math.floor(Math.random() * HEART_EMOJIS.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (1.2 + Math.random() * 1.4) + 'rem';
      heart.style.setProperty('--drift', (Math.random() * 160 - 80) + 'px');
      const duration = 2.6 + Math.random() * 1.8;
      const delay = Math.random() * 0.6;
      heart.style.animationDuration = duration + 's';
      heart.style.animationDelay = delay + 's';
      fxLayer.appendChild(heart);
      setTimeout(() => heart.remove(), (duration + delay) * 1000 + 200);
    }
  }

  yesBtn.addEventListener('click', () => {
    launchHearts();
    yesBtn.disabled = true;
    thanksMsg.textContent = "Yay! You just made me the happiest person ever 🥰💖";
    thanksMsg.classList.remove('hidden');
  });

  renderBoard();
})();
</script>

<audio id="bgMusic" autoplay loop>
  <source src="path/to/kesho_kutwa.mp3" type="audio/mpeg">
</audio>

</body>
</html>
